name: Daily DB Backup → Cloudflare R2

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC every day (~06:00 Israel)
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Install pg_dump (Postgres 15, same as Supabase) ──
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-15

      # ── 2. Dump the database ─────────────────────────────────
      - name: Run pg_dump
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%d_%H%M)
          BACKUP_FILE="myski_${TIMESTAMP}.dump"

          pg_dump \
            --host=db.ukyaotvcjflknionczfn.supabase.co \
            --port=5432 \
            --username=postgres \
            --dbname=postgres \
            --format=custom \
            --no-acl \
            --no-owner \
            --file="${BACKUP_FILE}"

          SIZE=$(stat -c%s "${BACKUP_FILE}")
          echo "Backup size: ${SIZE} bytes"
          if [ "${SIZE}" -lt 512 ]; then
            echo "ERROR: backup file suspiciously small (${SIZE} bytes)"
            exit 1
          fi

          echo "BACKUP_FILE=${BACKUP_FILE}" >> $GITHUB_ENV

      # ── 3. Install rclone ────────────────────────────────────
      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash -s beta

      # ── 4. Configure rclone → Cloudflare R2 ─────────────────
      - name: Configure rclone
        env:
          R2_ACCOUNT_ID:       ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:    ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
          acl = private
          EOF

      # ── 5. Upload to R2 ──────────────────────────────────────
      - name: Upload backup
        run: |
          rclone copy "${BACKUP_FILE}" r2:myski-backups/
          echo "✅ Uploaded: ${BACKUP_FILE}"

      # ── 6. Delete backups older than 10 days ─────────────────
      - name: Prune old backups
        run: |
          rclone delete r2:myski-backups/ --min-age 10d --verbose

      # ── 7. Email alert on any failure ────────────────────────
      - name: Send failure email
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sX POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"backup@my-ski.vercel.app\",
              \"to\": [\"bd12123@gmail.com\"],
              \"subject\": \"🚨 MySki גיבוי DB נכשל — $(date -u +%Y-%m-%d)\",
              \"html\": \"<h2>הגיבוי היומי של MySki נכשל</h2><p>בדוק את הלוגים:</p><p><a href='${RUN_URL}'>${RUN_URL}</a></p>\"
            }"
